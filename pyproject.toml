[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-fraud-detection"
version = "1.0.0"
description = "Production-ready enterprise fraud detection system"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "scikit-learn>=1.5",
    "pandas>=2.2",
    "numpy>=1.26",
    "matplotlib>=3.9",
    "plotly>=5.24",
    "seaborn>=0.13",
    "scipy>=1.13",
    "imbalanced-learn>=0.12",
    "xgboost>=2.1",
    "lightgbm>=4.5",
    "catboost>=1.2",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "loguru>=0.7",
    "joblib>=1.4",
    "shap>=0.46",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "python-multipart>=0.0.12",
    "streamlit>=1.40",
    "psutil>=6.1",
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "black>=24.10", "ruff>=0.8", "mypy>=1.13", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "D"]
ignore = ["D203", "D213"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
markers = [
    "unit: isolated tests with no application services or repository artifacts",
    "integration: tests across multiple real application components",
    "e2e: public workflow tests through the application boundary",
]
