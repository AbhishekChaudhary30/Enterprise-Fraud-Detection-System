project:
  name: enterprise-fraud-detection
  phase: 5

dataset:
  filename: creditcard.csv
  target_column: Class
  download_url: https://www.kaggle.com/api/v1/datasets/download/mlg-ulb/creditcardfraud

paths:
  raw_data: data/raw
  processed_data: data/processed
  external_data: data/external
  models: models
  artifacts: artifacts
  logs: logs
  reports: reports
  figures: reports/figures

logging:
  level: INFO
  rotation: 00:00
  retention: 30 days

training:
  random_state: 42
  test_size: 0.20
  validation_size: 0.20
  smote_enabled: false
  selection_metric: average_precision
  search_type: randomized
  cv_folds: 3
  randomized_iterations: 2
  selected_features: []
  drop_features: []
  derived_features: []
  models:
    logistic_regression:
      enabled: true
      class_weight: balanced
      max_iter: 1000
      c: [0.1, 1.0]
    random_forest:
      enabled: true
      n_estimators: [100]
      max_depth: [12]
      min_samples_leaf: [1]
      class_weight: balanced_subsample
    xgboost:
      enabled: true
      n_estimators: [100]
      max_depth: [6]
      learning_rate: [0.1]
      subsample: [0.9]
      colsample_bytree: [0.9]
    lightgbm:
      enabled: true
      n_estimators: [100]
      num_leaves: [31]
      learning_rate: [0.1]
    catboost:
      enabled: true
      iterations: [100]
      depth: [6]
      learning_rate: [0.1]

evaluation:
  output_directory: reports/evaluation
  plots_directory: reports/figures/evaluation
  shap_directory: reports/shap
  experiment_history: reports/experiments.jsonl
  threshold_strategy: maximum_f1
  business_threshold: 0.50
  threshold_grid_size: 99
  shap_sample_size: 1000
  calibration_bins: 10

serving:
  host: 127.0.0.1
  port: 8000
  api_prefix: /api/v1
  history_file: artifacts/prediction_history.jsonl
  upload_directory: artifacts/uploads
  output_directory: artifacts/predictions
  jwt_algorithm: HS256
  access_token_expire_minutes: 60
  admin_username: admin
  default_threshold: 0.32

production:
  environment: development
  rate_limit_requests: 120
  rate_limit_window_seconds: 60
  request_id_header: X-Request-ID
  metrics_path: artifacts/metrics.json
  drift_output_directory: reports/drift
  benchmark_output_directory: reports/benchmarks
  reference_data_path: data/raw/creditcard.csv
  drift_numeric_threshold: 0.10
  drift_prediction_threshold: 0.10
