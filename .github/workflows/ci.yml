name: Continuous Integration

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src scripts dashboard tests
      - name: Black
        run: black --check src scripts dashboard tests
      - name: Mypy
        run: mypy src
      - name: Pytest
        run: pytest -q
